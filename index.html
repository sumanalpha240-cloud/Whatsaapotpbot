<style>
body {
    margin:0;

}

/* Screens */

.active { display:block; }

/* Numbers */
.number-box {
    padding:12px;

/* Buttons */
button {

input {

/* Warning */

}

.warning {
    display:none;
    margin-top:15px;
    padding:15px;
    background:#330000;
    color:#ff4444;
    border-radius:10px;
    animation:glowred 1s infinite alternate;
}

/* Failed screen */

    background: radial-gradient(circle,#330000,#000);
}

<script>

// NAV
function go(n){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById('screen'+n).classList.add('active');
window.scrollTo(0,0);
}

// NUMBERS
function gen(){
let box=document.getElementById('numbers');

for(let i=0;i<100;i++){
let first=Math.floor(Math.random()*4)+6;
let rest="";
for(let j=0;j<9;j++){ rest+=Math.floor(Math.random()*10); }

let num="+91 "+first+rest;

let d=document.createElement("div");
d.className="number-box";
d.innerText=num;

// click → scanner
d.onclick=function(){ go(2); };

box.appendChild(d);
}
}
gen();

// SCANNER
let scanner;
function startScanner(){
scanner=new Html5Qrcode("qr-reader");

scanner.start(
{ facingMode:"environment"},
{ fps:10, qrbox:250},
()=>{
alert("Scanned ✅");
scanner.stop();
});
}

// UTR CHECK
function checkUTR(){
let utr=document.getElementById("utr").value;

if(utr.length<5){
document.getElementById("warningBox").style.display="block";
}else{
document.getElementById("warningBox").style.display="none";
go(3);
}
}

// AI BACKGROUND
const canvas=document.getElementById("bgCanvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

for(let i=0;i<80;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
vx:Math.random()*1-0.5,
vy:Math.random()*1-0.5
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);

for(let p of particles){
p.x+=p.vx;
p.y+=p.vy;

if(p.x<0||p.x>canvas.width) p.vx*=-1;
if(p.y<0||p.y>canvas.height) p.vy*=-1;

ctx.beginPath();
ctx.arc(p.x,p.y,2,0,Math.PI*2);
ctx.fillStyle="#00ffff";
ctx.fill();
}

for(let i=0;i<particles.length;i++){
for(let j=i+1;j<particles.length;j++){
let dx=particles[i].x-particles[j].x;
let dy=particles[i].y-particles[j].y;
let dist=Math.sqrt(dx*dx+dy*dy);

if(dist<120){
ctx.beginPath();
ctx.moveTo(particles[i].x,particles[i].y);
ctx.lineTo(particles[j].x,particles[j].y);
ctx.strokeStyle="rgba(0,255,255,0.2)";
ctx.stroke();
}
}
}

requestAnimationFrame(animate);
}

animate();

window.onresize=()=>{
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
};

</script>
